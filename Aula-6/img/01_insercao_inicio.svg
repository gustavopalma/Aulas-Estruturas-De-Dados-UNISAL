<rect x="1390" y="700" width="330" height="180" class="cell" fill="#f3f4f6"/><text x="1555" y="750" class="code" text-anchor="middle">novo-&gt;proximo = inicio;</text><text x="1555" y="805" class="code" text-anchor="middle">inicio = novo;</text><text x="1555" y="850" class="small" text-anchor="middle">O novo nó torna-se o primeiro.</text>
