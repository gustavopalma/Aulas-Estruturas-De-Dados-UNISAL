<path d="M640 340 C690 340 705 340 745 340" fill="none" stroke="#2563eb" stroke-width="6" marker-end="url(#ab)"/>
<line x1="900" y1="530" x2="900" y2="620" stroke="#c2410c" stroke-width="6" marker-end="url(#ao)"/><text x="935" y="580" class="note orange">Inserir 5 no início</text>
