<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="950" viewBox="0 0 1800 950">
<defs>
<style>
.title{font:700 42px Arial,sans-serif;fill:#6b21a8}.subtitle{font:500 24px Arial,sans-serif;fill:#374151}
.section{font:700 30px Arial,sans-serif}.label{font:700 27px Arial,sans-serif;fill:#1f2937}
.field{font:700 24px Arial,sans-serif;fill:#1f2937}.value{font:700 30px Consolas,monospace;fill:#1f2937}
.addr{font:700 22px Consolas,monospace;fill:#2563eb}.small{font:500 20px Arial,sans-serif;fill:#374151}
.note{font:700 22px Arial,sans-serif}.code{font:700 22px Consolas,monospace;fill:#1f2937}
.cell{stroke:#1f2937;stroke-width:3;rx:16;ry:16}.green{fill:#15803d}.blue{fill:#2563eb}.orange{fill:#c2410c}.purple{fill:#6b21a8}.red{fill:#b91c1c}
</style>
<marker id="ab" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#2563eb"/></marker>
<marker id="ag" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#15803d"/></marker>
</defs>
<rect width="1800" height="950" fill="#fff"/>
<text x="70" y="80" class="title">Lista encadeada simples</text>
<text x="70" y="125" class="subtitle">Cada nó armazena um dado e o endereço do próximo nó da lista.</text>

<rect x="90" y="320" width="240" height="150" class="cell" fill="#eadcf7"/>
<text x="210" y="375" class="label" text-anchor="middle">início</text>
<text x="210" y="425" class="value" text-anchor="middle">0x2000</text>

<text x="500" y="245" class="section green" text-anchor="middle">Nó 1</text>
<rect x="390" y="290" width="300" height="250" class="cell" fill="#d9f5df"/>
<line x1="390" y1="405" x2="690" y2="405" stroke="#1f2937" stroke-width="3"/>
<text x="540" y="350" class="field" text-anchor="middle">dado</text>
<text x="540" y="395" class="value" text-anchor="middle">10</text>
<text x="540" y="460" class="field" text-anchor="middle">próximo</text>
<text x="540" y="510" class="value" text-anchor="middle">0x3000</text>
<text x="540" y="585" class="addr" text-anchor="middle">endereço: 0x2000</text>

<text x="950" y="245" class="section blue" text-anchor="middle">Nó 2</text>
<rect x="800" y="290" width="300" height="250" class="cell" fill="#dcecff"/>
<line x1="800" y1="405" x2="1100" y2="405" stroke="#1f2937" stroke-width="3"/>
<text x="950" y="350" class="field" text-anchor="middle">dado</text>
<text x="950" y="395" class="value" text-anchor="middle">20</text>
<text x="950" y="460" class="field" text-anchor="middle">próximo</text>
<text x="950" y="510" class="value" text-anchor="middle">0x4000</text>
<text x="950" y="585" class="addr" text-anchor="middle">endereço: 0x3000</text>

<text x="1360" y="245" class="section orange" text-anchor="middle">Nó 3</text>
<rect x="1210" y="290" width="300" height="250" class="cell" fill="#ffe0c7"/>
<line x1="1210" y1="405" x2="1510" y2="405" stroke="#1f2937" stroke-width="3"/>
<text x="1360" y="350" class="field" text-anchor="middle">dado</text>
<text x="1360" y="395" class="value" text-anchor="middle">30</text>
<text x="1360" y="460" class="field" text-anchor="middle">próximo</text>
<text x="1360" y="510" class="value red" text-anchor="middle">NULL</text>
<text x="1360" y="585" class="addr" text-anchor="middle">endereço: 0x4000</text>

<path d="M330 395 C350 395 360 395 375 395" fill="none" stroke="#15803d" stroke-width="6" marker-end="url(#ag)"/>
<path d="M690 475 C735 475 750 475 785 475" fill="none" stroke="#2563eb" stroke-width="6" marker-end="url(#ab)"/>
<path d="M1100 475 C1145 475 1160 475 1195 475" fill="none" stroke="#2563eb" stroke-width="6" marker-end="url(#ab)"/>

<text x="555" y="680" class="note green" text-anchor="middle">início armazena o endereço do primeiro nó</text>
<text x="950" y="725" class="note blue" text-anchor="middle">O campo próximo liga um nó ao seguinte</text>
<text x="1360" y="680" class="note red" text-anchor="middle">NULL indica o fim da lista</text>

<rect x="300" y="780" width="1200" height="110" class="cell" fill="#f3f4f6"/>
<text x="900" y="825" class="code" text-anchor="middle">typedef struct No { int dado; struct No *proximo; } No;</text>
<text x="900" y="865" class="small" text-anchor="middle">Os nós não precisam estar contíguos na memória; os ponteiros mantêm a sequência lógica.</text>
</svg>