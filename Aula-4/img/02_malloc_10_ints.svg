<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
<defs>
<style>
.title{font:700 40px Arial,sans-serif;fill:#6b21a8}
.subtitle{font:500 23px Arial,sans-serif;fill:#374151}
.section{font:700 30px Arial,sans-serif}
.label{font:700 27px Arial,sans-serif}
.code{font:700 24px Consolas,monospace;fill:#1f2937}
.addr{font:700 22px Consolas,monospace;fill:#2563eb}
.value{font:700 29px Consolas,monospace;fill:#1f2937}
.small{font:500 20px Arial,sans-serif;fill:#374151}
.note{font:700 22px Arial,sans-serif}
.cell{stroke:#1f2937;stroke-width:3;rx:14;ry:14}
.green{fill:#15803d}.blue{fill:#2563eb}.orange{fill:#c2410c}.purple{fill:#6b21a8}.red{fill:#b91c1c}
</style>
<marker id="ab" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#2563eb"/></marker>
<marker id="ao" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#c2410c"/></marker>
<marker id="ag" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#15803d"/></marker>
<marker id="ar" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#b91c1c"/></marker>
</defs>
<rect width="1600" height="950" fill="#fff"/>
<text x="60" y="75" class="title">Alocação de um vetor dinâmico</text>

<text x="60" y="120" class="subtitle">malloc reserva um bloco contínuo com espaço para dez inteiros.</text>
<rect x="150" y="160" width="1300" height="95" class="cell" fill="#f3f4f6"/>
<text x="800" y="218" class="code" text-anchor="middle">int *p = malloc(10 * sizeof(int));</text>
<text x="170" y="330" class="section purple">Stack</text>
<rect x="120" y="370" width="300" height="170" class="cell" fill="#eadcf7"/>
<text x="270" y="430" class="label" text-anchor="middle">p</text>
<text x="270" y="485" class="value" text-anchor="middle">0x2000</text>
<text x="270" y="525" class="small" text-anchor="middle">endereço do primeiro int</text>
<text x="700" y="330" class="section green">Heap</text>
<rect x="500" y="420" width="90" height="120" class="cell" fill="#d9f5df"/><text x="545" y="470" class="value" text-anchor="middle">?</text><text x="545" y="575" class="small" text-anchor="middle">0</text><rect x="590" y="420" width="90" height="120" class="cell" fill="#fff1b8"/><text x="635" y="470" class="value" text-anchor="middle">?</text><text x="635" y="575" class="small" text-anchor="middle">1</text><rect x="680" y="420" width="90" height="120" class="cell" fill="#dcecff"/><text x="725" y="470" class="value" text-anchor="middle">?</text><text x="725" y="575" class="small" text-anchor="middle">2</text><rect x="770" y="420" width="90" height="120" class="cell" fill="#ffe0c7"/><text x="815" y="470" class="value" text-anchor="middle">?</text><text x="815" y="575" class="small" text-anchor="middle">3</text><rect x="860" y="420" width="90" height="120" class="cell" fill="#eadcf7"/><text x="905" y="470" class="value" text-anchor="middle">?</text><text x="905" y="575" class="small" text-anchor="middle">4</text><rect x="950" y="420" width="90" height="120" class="cell" fill="#d9f5df"/><text x="995" y="470" class="value" text-anchor="middle">?</text><text x="995" y="575" class="small" text-anchor="middle">5</text><rect x="1040" y="420" width="90" height="120" class="cell" fill="#fff1b8"/><text x="1085" y="470" class="value" text-anchor="middle">?</text><text x="1085" y="575" class="small" text-anchor="middle">6</text><rect x="1130" y="420" width="90" height="120" class="cell" fill="#dcecff"/><text x="1175" y="470" class="value" text-anchor="middle">?</text><text x="1175" y="575" class="small" text-anchor="middle">7</text><rect x="1220" y="420" width="90" height="120" class="cell" fill="#ffe0c7"/><text x="1265" y="470" class="value" text-anchor="middle">?</text><text x="1265" y="575" class="small" text-anchor="middle">8</text><rect x="1310" y="420" width="90" height="120" class="cell" fill="#eadcf7"/><text x="1355" y="470" class="value" text-anchor="middle">?</text><text x="1355" y="575" class="small" text-anchor="middle">9</text>
<path d="M420 455 C455 455 460 455 485 455" fill="none" stroke="#c2410c" stroke-width="5" marker-end="url(#ao)"/>
<text x="950" y="630" class="note blue" text-anchor="middle">10 × 4 bytes = 40 bytes</text>
<text x="950" y="675" class="small" text-anchor="middle">Os valores permanecem indeterminados até serem inicializados.</text>
<rect x="300" y="740" width="1000" height="105" class="cell" fill="#dcecff"/>
<text x="800" y="785" class="code" text-anchor="middle">p[0] ... p[9]</text>
<text x="800" y="825" class="note blue" text-anchor="middle">Cada índice acessa uma posição do bloco contínuo.</text>

</svg>