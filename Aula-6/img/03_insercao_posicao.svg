<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000">
<defs><style>
.title{font:700 42px Arial,sans-serif;fill:#6b21a8}.subtitle{font:500 24px Arial,sans-serif;fill:#374151}
.section{font:700 29px Arial,sans-serif}.label{font:700 25px Arial,sans-serif;fill:#1f2937}
.field{font:700 22px Arial,sans-serif;fill:#1f2937}.value{font:700 28px Consolas,monospace;fill:#1f2937}
.addr{font:700 21px Consolas,monospace;fill:#2563eb}.code{font:700 22px Consolas,monospace;fill:#1f2937}
.note{font:700 21px Arial,sans-serif}.small{font:500 19px Arial,sans-serif;fill:#374151}
.cell{stroke:#1f2937;stroke-width:3;rx:15;ry:15}.green{fill:#15803d}.blue{fill:#2563eb}.orange{fill:#c2410c}.purple{fill:#6b21a8}.red{fill:#b91c1c}
</style>
<marker id="ab" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#2563eb"/></marker>
<marker id="ag" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#15803d"/></marker>
<marker id="ao" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#c2410c"/></marker>
</defs><rect width="1800" height="1000" fill="#fff"/>
<text x="65" y="80" class="title">Inserção em uma posição específica</text><text x="65" y="125" class="subtitle">O novo nó é ligado entre o nó anterior e o nó que ocupava a posição desejada.</text>
<text x="90" y="195" class="section purple">Inserir o valor 15 na posição 1</text>
<rect x="70" y="265" width="210" height="125" class="cell" fill="#eadcf7"/><text x="175" y="310" class="label" text-anchor="middle">início</text><text x="175" y="355" class="value" text-anchor="middle">0x2000</text>
<text x="500.0" y="215" class="section" text-anchor="middle">posição 0</text>
<rect x="360" y="240" width="280" height="210" class="cell" fill="#d9f5df"/>
<line x1="360" y1="335" x2="640" y2="335" stroke="#1f2937" stroke-width="3"/>
<text x="500.0" y="278" class="field" text-anchor="middle">dado</text><text x="500.0" y="318" class="value" text-anchor="middle">10</text>
<text x="500.0" y="375" class="field" text-anchor="middle">próximo</text><text x="500.0" y="418" class="value" text-anchor="middle">0x3000</text>
<text x="500.0" y="488" class="addr" text-anchor="middle">endereço: 0x2000</text>
<text x="1180.0" y="215" class="section" text-anchor="middle">posição 1</text>
<rect x="1040" y="240" width="280" height="210" class="cell" fill="#dcecff"/>
<line x1="1040" y1="335" x2="1320" y2="335" stroke="#1f2937" stroke-width="3"/>
<text x="1180.0" y="278" class="field" text-anchor="middle">dado</text><text x="1180.0" y="318" class="value" text-anchor="middle">20</text>
<text x="1180.0" y="375" class="field" text-anchor="middle">próximo</text><text x="1180.0" y="418" class="value" text-anchor="middle">NULL</text>
<text x="1180.0" y="488" class="addr" text-anchor="middle">endereço: 0x3000</text>
<path d="M280 327 C315 327 325 327 345 327" fill="none" stroke="#15803d" stroke-width="6" marker-end="url(#ag)"/>
<path d="M640 345 C780 345 880 345 1025 345" fill="none" stroke="#2563eb" stroke-width="6" marker-end="url(#ab)"/>
<text x="850.0" y="585" class="section" text-anchor="middle">Novo nó</text>
<rect x="700" y="610" width="300" height="210" class="cell" fill="#fff1b8"/>
<line x1="700" y1="705" x2="1000" y2="705" stroke="#1f2937" stroke-width="3"/>
<text x="850.0" y="648" class="field" text-anchor="middle">dado</text><text x="850.0" y="688" class="value" text-anchor="middle">15</text>
<text x="850.0" y="745" class="field" text-anchor="middle">próximo</text><text x="850.0" y="788" class="value" text-anchor="middle">0x3000</text>
<text x="850.0" y="858" class="addr" text-anchor="middle">novo nó: 0x2500</text>
<path d="M640 430 C680 500 710 540 745 595" fill="none" stroke="#c2410c" stroke-width="6" marker-end="url(#ao)"/><text x="520" y="535" class="note orange">1. novo aponta para o sucessor</text>
<path d="M1000 715 C1090 650 1160 555 1170 465" fill="none" stroke="#2563eb" stroke-width="6" marker-end="url(#ab)"/><text x="1160" y="650" class="note blue">2. anterior aponta para o novo</text>
<rect x="1300" y="590" width="420" height="240" class="cell" fill="#f3f4f6"/><text x="1510" y="645" class="code" text-anchor="middle">novo-&gt;proximo = anterior-&gt;proximo;</text><text x="1510" y="705" class="code" text-anchor="middle">anterior-&gt;proximo = novo;</text><text x="1510" y="765" class="small" text-anchor="middle">A ordem evita perder o restante</text><text x="1510" y="800" class="small" text-anchor="middle">da lista encadeada.</text>
<rect x="250" y="900" width="1300" height="60" class="cell" fill="#dcecff"/><text x="900" y="938" class="note blue" text-anchor="middle">Resultado lógico: 10 → 15 → 20 → NULL</text>
</svg>