<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050">

<defs>
<style>
.title{font:700 42px Arial,sans-serif;fill:#6b21a8}
.subtitle{font:500 24px Arial,sans-serif;fill:#374151}
.label{font:700 28px Arial,sans-serif;fill:#1f2937}
.value{font:700 32px Consolas,monospace;fill:#1f2937}
.code{font:700 23px Consolas,monospace;fill:#1f2937}
.note{font:700 22px Arial,sans-serif}
.small{font:500 20px Arial,sans-serif;fill:#374151}
.cell{stroke:#1f2937;stroke-width:3;rx:16;ry:16}
.green{fill:#15803d}.blue{fill:#2563eb}.orange{fill:#c2410c}.purple{fill:#6b21a8}.red{fill:#b91c1c}
</style>
<marker id="ag" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#15803d"/></marker>
<marker id="ar" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#b91c1c"/></marker>
<marker id="ab" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#2563eb"/></marker>
<marker id="ao" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#c2410c"/></marker>
</defs>

<rect width="1800" height="1050" fill="#fff"/>
<text x="70" y="80" class="title">Liberação completa da fila</text>
<text x="70" y="125" class="subtitle">Cada nó é removido do início e liberado com free().</text>

<text x="900" y="215" class="label" text-anchor="middle">Cada iteração remove o nó do início</text>

<rect x="260" y="350" width="300" height="180" class="cell" fill="#f8d7da" stroke="#b91c1c" stroke-width="6" stroke-dasharray="10 8"/>
<rect x="750" y="350" width="300" height="180" class="cell" fill="#f8d7da" stroke="#b91c1c" stroke-width="6" stroke-dasharray="10 8"/>
<rect x="1240" y="350" width="300" height="180" class="cell" fill="#f8d7da" stroke="#b91c1c" stroke-width="6" stroke-dasharray="10 8"/>
<text x="410" y="455" class="value" text-anchor="middle">10</text>
<text x="900" y="455" class="value" text-anchor="middle">20</text>
<text x="1390" y="455" class="value" text-anchor="middle">30</text>
<text x="410" y="590" class="note red" text-anchor="middle">free(10)</text>
<text x="900" y="590" class="note red" text-anchor="middle">free(20)</text>
<text x="1390" y="590" class="note red" text-anchor="middle">free(30)</text>

<line x1="580" y1="440" x2="720" y2="440" stroke="#b91c1c" stroke-width="6" marker-end="url(#ar)"/>
<line x1="1070" y1="440" x2="1210" y2="440" stroke="#b91c1c" stroke-width="6" marker-end="url(#ar)"/>

<rect x="360" y="750" width="1080" height="150" class="cell" fill="#d9f5df"/>
<text x="900" y="805" class="code" text-anchor="middle">inicio = fim = NULL;</text>
<text x="900" y="855" class="note green" text-anchor="middle">Ao final, a fila está vazia e sem nós alocados.</text>

</svg>