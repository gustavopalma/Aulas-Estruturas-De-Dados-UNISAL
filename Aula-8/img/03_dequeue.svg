<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050">

<defs>
<style>
.title{font:700 42px Arial,sans-serif;fill:#6b21a8}
.subtitle{font:500 24px Arial,sans-serif;fill:#374151}
.label{font:700 28px Arial,sans-serif;fill:#1f2937}
.value{font:700 32px Consolas,monospace;fill:#1f2937}
.code{font:700 23px Consolas,monospace;fill:#1f2937}
.note{font:700 22px Arial,sans-serif}
.small{font:500 20px Arial,sans-serif;fill:#374151}
.cell{stroke:#1f2937;stroke-width:3;rx:16;ry:16}
.green{fill:#15803d}.blue{fill:#2563eb}.orange{fill:#c2410c}.purple{fill:#6b21a8}.red{fill:#b91c1c}
</style>
<marker id="ag" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#15803d"/></marker>
<marker id="ar" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#b91c1c"/></marker>
<marker id="ab" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#2563eb"/></marker>
<marker id="ao" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#c2410c"/></marker>
</defs>

<rect width="1800" height="1050" fill="#fff"/>
<text x="70" y="80" class="title">Dequeue — remoção da fila</text>
<text x="70" y="125" class="subtitle">O elemento do início é removido primeiro.</text>

<rect x="510" y="170" width="780" height="90" class="cell" fill="#f3f4f6"/>
<text x="900" y="225" class="code" text-anchor="middle">valor = dequeue()</text>

<text x="470" y="335" class="label" text-anchor="middle">Antes</text>
<rect x="160" y="390" width="220" height="140" class="cell" fill="#f8d7da" stroke="#b91c1c" stroke-width="6"/>
<rect x="380" y="390" width="220" height="140" class="cell" fill="#fff1b8"/>
<rect x="600" y="390" width="220" height="140" class="cell" fill="#dcecff"/>
<rect x="820" y="390" width="220" height="140" class="cell" fill="#ffe0c7"/>
<text x="270" y="475" class="value" text-anchor="middle">10</text>
<text x="490" y="475" class="value" text-anchor="middle">20</text>
<text x="710" y="475" class="value" text-anchor="middle">30</text>
<text x="930" y="475" class="value" text-anchor="middle">40</text>
<text x="270" y="585" class="note red" text-anchor="middle">início</text>
<text x="930" y="585" class="note blue" text-anchor="middle">fim</text>

<line x1="1060" y1="460" x2="1180" y2="460" stroke="#b91c1c" stroke-width="7" marker-end="url(#ar)"/>
<text x="1120" y="420" class="note red" text-anchor="middle">remove 10</text>

<text x="1430" y="335" class="label" text-anchor="middle">Depois</text>
<rect x="1190" y="390" width="180" height="140" class="cell" fill="#fff1b8"/>
<rect x="1370" y="390" width="180" height="140" class="cell" fill="#dcecff"/>
<rect x="1550" y="390" width="180" height="140" class="cell" fill="#ffe0c7"/>
<text x="1280" y="475" class="value" text-anchor="middle">20</text>
<text x="1460" y="475" class="value" text-anchor="middle">30</text>
<text x="1640" y="475" class="value" text-anchor="middle">40</text>
<text x="1280" y="585" class="note green" text-anchor="middle">novo início</text>
<text x="1640" y="585" class="note blue" text-anchor="middle">fim</text>

<rect x="300" y="750" width="1200" height="150" class="cell" fill="#f8d7da"/>
<text x="900" y="805" class="note red" text-anchor="middle">O elemento mais antigo é removido e retornado.</text>
<text x="900" y="855" class="code" text-anchor="middle">inicio = inicio-&gt;proximo;</text>

</svg>