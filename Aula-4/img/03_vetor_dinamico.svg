<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
<defs>
<style>
.title{font:700 40px Arial,sans-serif;fill:#6b21a8}
.subtitle{font:500 23px Arial,sans-serif;fill:#374151}
.section{font:700 30px Arial,sans-serif}
.label{font:700 27px Arial,sans-serif}
.code{font:700 24px Consolas,monospace;fill:#1f2937}
.addr{font:700 22px Consolas,monospace;fill:#2563eb}
.value{font:700 29px Consolas,monospace;fill:#1f2937}
.small{font:500 20px Arial,sans-serif;fill:#374151}
.note{font:700 22px Arial,sans-serif}
.cell{stroke:#1f2937;stroke-width:3;rx:14;ry:14}
.green{fill:#15803d}.blue{fill:#2563eb}.orange{fill:#c2410c}.purple{fill:#6b21a8}.red{fill:#b91c1c}
</style>
<marker id="ab" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#2563eb"/></marker>
<marker id="ao" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#c2410c"/></marker>
<marker id="ag" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#15803d"/></marker>
<marker id="ar" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#b91c1c"/></marker>
</defs>
<rect width="1600" height="950" fill="#fff"/>
<text x="60" y="75" class="title">Vetor dinâmico em memória</text>

<text x="60" y="120" class="subtitle">Após a alocação, o ponteiro pode ser usado como um vetor comum.</text>
<rect x="170" y="160" width="1260" height="95" class="cell" fill="#f3f4f6"/>
<text x="800" y="218" class="code" text-anchor="middle">int *p = malloc(5 * sizeof(int));</text>
<rect x="120" y="345" width="280" height="170" class="cell" fill="#eadcf7"/>
<text x="260" y="405" class="label" text-anchor="middle">p</text>
<text x="260" y="458" class="value" text-anchor="middle">0x2000</text>
<path d="M400 430 C445 430 455 430 495 430" fill="none" stroke="#c2410c" stroke-width="5" marker-end="url(#ao)"/>
<rect x="510" y="360" width="170" height="150" class="cell" fill="#d9f5df"/><text x="595" y="420" class="value" text-anchor="middle">10</text><text x="595" y="465" class="small" text-anchor="middle">p[0]</text><text x="595" y="550" class="addr" text-anchor="middle">0x2000</text><rect x="680" y="360" width="170" height="150" class="cell" fill="#fff1b8"/><text x="765" y="420" class="value" text-anchor="middle">20</text><text x="765" y="465" class="small" text-anchor="middle">p[1]</text><text x="765" y="550" class="addr" text-anchor="middle">0x2004</text><rect x="850" y="360" width="170" height="150" class="cell" fill="#dcecff"/><text x="935" y="420" class="value" text-anchor="middle">30</text><text x="935" y="465" class="small" text-anchor="middle">p[2]</text><text x="935" y="550" class="addr" text-anchor="middle">0x2008</text><rect x="1020" y="360" width="170" height="150" class="cell" fill="#ffe0c7"/><text x="1105" y="420" class="value" text-anchor="middle">40</text><text x="1105" y="465" class="small" text-anchor="middle">p[3]</text><text x="1105" y="550" class="addr" text-anchor="middle">0x200C</text><rect x="1190" y="360" width="170" height="150" class="cell" fill="#eadcf7"/><text x="1275" y="420" class="value" text-anchor="middle">50</text><text x="1275" y="465" class="small" text-anchor="middle">p[4]</text><text x="1275" y="550" class="addr" text-anchor="middle">0x2010</text>
<text x="935" y="635" class="note green" text-anchor="middle">Aritmética de endereços: cada int avança 4 bytes</text>
<rect x="300" y="710" width="1000" height="120" class="cell" fill="#fff1b8"/>
<text x="800" y="758" class="code" text-anchor="middle">p[i] == *(p + i)</text>
<text x="800" y="802" class="note orange" text-anchor="middle">A notação de vetor é uma forma mais legível de acessar o bloco.</text>

</svg>