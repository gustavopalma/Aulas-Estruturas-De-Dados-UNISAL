<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
  <defs>
    <style>
      .title{font:700 38px Arial,sans-serif}.label{font:700 28px Arial,sans-serif}.value{font:500 34px Arial,sans-serif;fill:#1f2937}.small{font:700 24px Arial,sans-serif}.address{font:700 21px Arial,sans-serif;fill:#2563eb}.note{font:700 23px Arial,sans-serif}.cell{stroke:#1f2937;stroke-width:3;rx:12;ry:12}.green{fill:#15803d}.purple{fill:#6b21a8}.blue{fill:#2563eb}.orange{fill:#c2410c}
    </style>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2563eb"/></marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#15803d"/></marker>
  </defs>
  <rect width="1600" height="950" fill="#fff"/>
  <text x="55" y="95" class="title purple">Índices das colunas:</text>
  <text x="500" y="95" class="title purple" text-anchor="middle">0</text><text x="710" y="95" class="title purple" text-anchor="middle">1</text><text x="920" y="95" class="title purple" text-anchor="middle">2</text><text x="1130" y="95" class="title purple" text-anchor="middle">3</text>
  <text x="80" y="215" class="label green">Linha 0</text><text x="80" y="375" class="label green">Linha 1</text><text x="80" y="535" class="label green">Linha 2</text>
  <g>
    <rect x="395" y="130" width="210" height="130" class="cell" fill="#d9f5df"/><rect x="605" y="130" width="210" height="130" class="cell" fill="#fff1b8"/><rect x="815" y="130" width="210" height="130" class="cell" fill="#dcecff"/><rect x="1025" y="130" width="210" height="130" class="cell" fill="#ffe0c7"/>
    <rect x="395" y="290" width="210" height="130" class="cell" fill="#eadcf7"/><rect x="605" y="290" width="210" height="130" class="cell" fill="#d9f5df"/><rect x="815" y="290" width="210" height="130" class="cell" fill="#fff1b8"/><rect x="1025" y="290" width="210" height="130" class="cell" fill="#dcecff"/>
    <rect x="395" y="450" width="210" height="130" class="cell" fill="#ffe0c7"/><rect x="605" y="450" width="210" height="130" class="cell" fill="#eadcf7"/><rect x="815" y="450" width="210" height="130" class="cell" fill="#d9f5df"/><rect x="1025" y="450" width="210" height="130" class="cell" fill="#fff1b8"/>
  </g>
  <g class="value" text-anchor="middle">
    <text x="500" y="205">10</text><text x="710" y="205">20</text><text x="920" y="205">30</text><text x="1130" y="205">40</text>
    <text x="500" y="365">50</text><text x="710" y="365">60</text><text x="920" y="365">70</text><text x="1130" y="365">80</text>
    <text x="500" y="525">90</text><text x="710" y="525">100</text><text x="920" y="525">110</text><text x="1130" y="525">120</text>
  </g>
  <g class="address" text-anchor="middle">
    <text x="500" y="286">0x1000</text><text x="710" y="286">0x1004</text><text x="920" y="286">0x1008</text><text x="1130" y="286">0x100C</text>
    <text x="500" y="446">0x1010</text><text x="710" y="446">0x1014</text><text x="920" y="446">0x1018</text><text x="1130" y="446">0x101C</text>
    <text x="500" y="606">0x1020</text><text x="710" y="606">0x1024</text><text x="920" y="606">0x1028</text><text x="1130" y="606">0x102C</text>
  </g>
  <line x1="1270" y1="195" x2="1410" y2="195" stroke="#15803d" stroke-width="4" stroke-dasharray="7 7" marker-end="url(#arrowGreen)"/>
  <text x="1430" y="165" class="note green">Cada posição é acessada</text><text x="1430" y="200" class="note green">por dois índices:</text><text x="1430" y="235" class="note green">matriz[linha][coluna]</text>
  <line x1="1410" y1="500" x2="1260" y2="500" stroke="#2563eb" stroke-width="4" stroke-dasharray="7 7" marker-end="url(#arrowBlue)"/>
  <text x="1430" y="465" class="note blue">Os elementos permanecem</text><text x="1430" y="500" class="note blue">contíguos na memória</text><text x="1430" y="535" class="note blue">linha após linha</text>
  <text x="800" y="700" class="small orange" text-anchor="middle">Endereço de matriz[i][j] = base + ((i × número de colunas) + j) × sizeof(tipo)</text>
  <path d="M395 755 V790 Q395 805 410 805 H785 Q800 805 800 820 Q800 805 815 805 H1220 Q1235 805 1235 790 V755" fill="none" stroke="#2563eb" stroke-width="4"/>
  <text x="815" y="870" class="small blue" text-anchor="middle">Bloco contínuo de memória reservado para a matriz</text>
</svg>
