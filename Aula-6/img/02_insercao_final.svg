<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000">
<defs><style>
.title{font:700 42px Arial,sans-serif;fill:#6b21a8}.subtitle{font:500 24px Arial,sans-serif;fill:#374151}
.section{font:700 29px Arial,sans-serif}.label{font:700 25px Arial,sans-serif;fill:#1f2937}
.field{font:700 22px Arial,sans-serif;fill:#1f2937}.value{font:700 28px Consolas,monospace;fill:#1f2937}
.addr{font:700 21px Consolas,monospace;fill:#2563eb}.code{font:700 22px Consolas,monospace;fill:#1f2937}
.note{font:700 21px Arial,sans-serif}.small{font:500 19px Arial,sans-serif;fill:#374151}
.cell{stroke:#1f2937;stroke-width:3;rx:15;ry:15}.green{fill:#15803d}.blue{fill:#2563eb}.orange{fill:#c2410c}.purple{fill:#6b21a8}.red{fill:#b91c1c}
</style>
