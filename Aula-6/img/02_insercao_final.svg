<marker id="ao" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#c2410c"/></marker>
</defs><rect width="1800" height="1000" fill="#fff"/>
<text x="65" y="80" class="title">Inserção no final da lista</text><text x="65" y="125" class="subtitle">Localize o último nó e faça seu campo próximo apontar para o novo nó.</text>
