<text x="900.0" y="375" class="field" text-anchor="middle">próximo</text><text x="900.0" y="418" class="value" text-anchor="middle">NULL</text>
<text x="900.0" y="488" class="addr" text-anchor="middle">endereço: 0x3000</text>
